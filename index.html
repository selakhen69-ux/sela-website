<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <title>Book Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Header -->
<header>
  <h1>📚 My Book Shop</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="books.html">Books</a>
    <a href="cart.html">Cart 🛒</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<!-- Books Section -->
<section class="books">

  <div class="book">
    <img src="book1.webp" alt="Book">
    <h3>Book Title</h3>
    <p>$10</p>
    <button onclick="addToCart('Book Title',10)">Add to Cart</button>
  </div>

  <div class="book">
    <img src="book2.webp" alt="Book">
    <h3>Another Book</h3>
    <p>$15</p>
    <button onclick="addToCart('Another Book',15)">Add to Cart</button>
  </div>

  <div class="book">
    <img src="book3.webp" alt="Book">
    <h3>New Book</h3>
    <p>$12</p>
    <button onclick="addToCart('New Book',12)">Add to Cart</button>
  </div>

  <div class="book">
    <img src="book4.webp" alt="Book">
    <h3>Story Book</h3>
    <p>$8</p>
    <button onclick="addToCart('Story Book',8)">Add to Cart</button>
  </div>
  <div class="book">
    <img src="003.jpg" alt="Book">
    <h3>លក់ស្រោមមួយទឹក</h3>
    <p>$7</p>
    <button onclick="addToCart('លក់ស្រោមមួយទឹក',7)">Add to Cart</button>
  </div>

</section>

<!-- Cart -->
<section class="cart-section">
  <h2>🛒 កន្ត្រក</h2>
  <div id="cart"></div>
  
</section>

<!-- Order Form -->
<section class="order-section">
  <h2>📦 កម្មង់</h2>

  <form onsubmit="sendOrder(event)">
    <input type="text" placeholder="ឈ្មោះ" id="name" required><br><br>
    <input type="text" placeholder="លេខទូរស័ព្ទ" id="phone" required><br><br>
    <input type="text" placeholder="អាសយដ្ឋាន" id="address" required><br><br>

   
    <!-- ប៊ូតុងបញ្ជាទិញ -->
<button type="button" onclick="openQR()">📦 បញ្ជាទិញ</button>

<!-- QR Popup -->
<div id="qrModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeQR()">&times;</span>

    <h3>សូមស្កេន QR ដើម្បីបង់ប្រាក់ 💳</h3>
    <img src="Khen Sela.jpg" width="200">

    <br><br>
    <button type="button" onclick="confirmOrder()">
  ✅ ខ្ញុំបានបង់ប្រាក់
</button>
  </div>
</div>
  </form>
 
</section>


<script src="script.js"></script>
</body>
</html>
